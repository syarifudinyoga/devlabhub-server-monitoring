<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevLabHub Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #0a0e1a; color: #e0e6f0; }
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 16px 24px; background: #0a0e1a; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.5rem; font-weight: 700; color: #f0f4ff; }
    header .sub { font-size: 0.85rem; color: #8892a0; }
    .status-badge { padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; }
    .status-ok { background: #0f766e; color: #fff; }
    .status-warning { background: #b45309; color: #fff; }
    .status-critical { background: #991b1b; color: #fff; }
    main { flex: 1; padding: 24px; max-width: 1400px; margin: 0 auto; width: 100%; }
    .page-title { font-size: 1.75rem; font-weight: 700; color: #f0f4ff; margin-bottom: 24px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #0a0e1a; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; }
    .stat-card .label { font-size: 0.85rem; color: #8892a0; font-weight: 500; }
    .stat-card .value { font-size: 1.8rem; font-weight: 700; color: #e0e6f0; margin-top: 8px; }
    .stat-card .value .trend { font-size: 1rem; font-weight: 500; }
    .stat-card .value .trend.up { color: #ef4444; }
    .stat-card .value .trend.down { color: #22c55e; }
    .card { background: #0a0e1a; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .card h2 { font-size: 1.1rem; font-weight: 600; color: #f0f4ff; margin-bottom: 16px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #1e293b; }
    th { color: #8892a0; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    tr:hover { background: #0f1320; }
    .badge { padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
    .badge-green { background: #0f766e; color: #fff; }
    .badge-yellow { background: #b45309; color: #fff; }
    .badge-red { background: #991b1b; color: #fff; }
    .badge-gray { background: #475569; color: #fff; }
    .badge-blue { background: #1d4ed8; color: #fff; }
    .threat-score { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
    .threat-bar { flex: 1; height: 8px; background: #1e293b; border-radius: 4px; overflow: hidden; }
    .threat-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
    .threat-fill.high { background: #ef4444; }
    .threat-fill.medium { background: #f59e0b; }
    .threat-fill.low { background: #22c55e; }
    .threat-label { font-size: 0.85rem; font-weight: 500; color: #8892a0; }
    .threat-severe { color: #ef4444; font-weight: 600; }
    .warnings-list { max-height: 300px; overflow-y: auto; }
    .warning-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #1e293b; }
    .warning-item:last-child { border-bottom: none; }
    .warning-item .msg { flex: 1; }
    .warning-item .msg small { color: #8892a0; font-size: 0.8rem; display: block; }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: #1e293b; color: #e0e6f0; border: 1px solid #334155; }
    .btn-secondary:hover { background: #334155; }
    .btn-danger { background: #991b1b; color: #fff; }
    .btn-danger:hover { background: #991b1b; }
    .empty-state { text-align: center; padding: 40px; color: #8892a0; }
    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
    .loading { text-align: center; padding: 40px; color: #8892a0; }
    .spinner { border: 3px solid #1e293b; border-top: 3px solid #3b82f6; border-radius: 50%; width: 32px; height: 32px; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .code-badge { background: #0f172a; padding: 2px 6px; border-radius: 3px; font-family: 'Courier New', monospace; font-size: 0.8rem; color: #38bdf8; }
    .access-detail { background: #0f172a; padding: 16px; border-radius: 8px; margin-top: 12px; border: 1px solid #1e293b; }
    .access-detail .key { color: #8892a0; font-size: 0.8rem; }
    .access-detail .value { color: #e0e6f0; font-weight: 500; }
    .hash { color: #8892a0; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
